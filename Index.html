<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cozinha - Pedidos</title>

    <link rel="stylesheet" href="Aparencia.css">
</head>

<body>

    <header class="topo">

        <div class="logo">
            🍽️ COZINHA
        </div>

        <div class="relogio" id="relogio">
            00:00:00
        </div>

    </header>


    <main class="cozinha">

        <div class="titulo">

            <h1>Pedidos</h1>

            <span id="totalPedidos">
                0 pedidos
            </span>

        </div>


        <section class="lista-pedidos" id="listaPedidos">

            <!-- PEDIDO 1 -->

            <article class="pedido" data-tempo="10">

                <div class="pedido-cabecalho">

                    <div>
                        <strong>#1025</strong>
                        <span class="cliente">
                            João Silva
                        </span>
                    </div>

                    <div class="tempo">
                        <span>Tempo:</span>

                        <strong class="tempo-real">
                            00:00
                        </strong>
                    </div>

                </div>


                <div class="itens">

                    <div class="item">
                        <strong>2x</strong>
                        <span>Hambúrguer Especial</span>
                    </div>

                    <div class="item">
                        <strong>1x</strong>
                        <span>Batata Frita</span>
                    </div>

                    <div class="item">
                        <strong>2x</strong>
                        <span>Refrigerante</span>
                    </div>

                </div>


                <div class="pedido-rodape">

                    <span class="status preparo">
                        EM PREPARO
                    </span>

                    <button
                        onclick="marcarPronto(this)">
                        ✓ PRONTO
                    </button>

                </div>

            </article>


            <!-- PEDIDO 2 -->

            <article class="pedido" data-tempo="5">

                <div class="pedido-cabecalho">

                    <div>
                        <strong>#1026</strong>

                        <span class="cliente">
                            Carlos Santos
                        </span>
                    </div>

                    <div class="tempo">

                        <span>Tempo:</span>

                        <strong class="tempo-real">
                            00:00
                        </strong>

                    </div>

                </div>


                <div class="itens">

                    <div class="item">
                        <strong>1x</strong>
                        <span>Pizza Calabresa</span>
                    </div>

                    <div class="item">
                        <strong>1x</strong>
                        <span>Coca-Cola</span>
                    </div>

                </div>


                <div class="pedido-rodape">

                    <span class="status preparo">
                        EM PREPARO
                    </span>

                    <button
                        onclick="marcarPronto(this)">
                        ✓ PRONTO
                    </button>

                </div>

            </article>


            <!-- PEDIDO 3 -->

            <article class="pedido" data-tempo="20">

                <div class="pedido-cabecalho">

                    <div>

                        <strong>#1027</strong>

                        <span class="cliente">
                            Maria Oliveira
                        </span>

                    </div>


                    <div class="tempo">

                        <span>Tempo:</span>

                        <strong class="tempo-real">
                            00:00
                        </strong>

                    </div>

                </div>


                <div class="itens">

                    <div class="item">
                        <strong>3x</strong>
                        <span>Pizza Portuguesa</span>
                    </div>

                    <div class="item">
                        <strong>2x</strong>
                        <span>Suco de Laranja</span>
                    </div>

                </div>


                <div class="pedido-rodape">

                    <span class="status preparo">
                        EM PREPARO
                    </span>

                    <button
                        onclick="marcarPronto(this)">
                        ✓ PRONTO
                    </button>

                </div>

            </article>

        </section>

    </main>


    <script src="Js.js"></script>

</body>

</html>
